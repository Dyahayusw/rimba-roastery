<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="founderTitle">
  <title id="founderTitle">Ilustrasi potret A. Wirawan, pendiri Rimba Roastery, di tengah kebun kopi</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C9270"/>
      <stop offset="100%" stop-color="#3F5136"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#skyGrad)"/>

  <!-- distant hills -->
  <path d="M0 330 Q100 300 200 325 Q300 350 400 315 L400 480 L0 480 Z" fill="#2E3D28"/>
  <path d="M0 360 Q120 335 240 358 Q320 372 400 350 L400 480 L0 480 Z" fill="#24301F"/>

  <!-- coffee plant leaves either side -->
  <g fill="#516B41">
    <ellipse cx="55" cy="420" rx="46" ry="20" transform="rotate(-30 55 420)"/>
    <ellipse cx="345" cy="420" rx="46" ry="20" transform="rotate(30 345 420)"/>
    <ellipse cx="30" cy="380" rx="40" ry="16" transform="rotate(-10 30 380)"/>
    <ellipse cx="370" cy="380" rx="40" ry="16" transform="rotate(10 370 380)"/>
  </g>

  <!-- person silhouette -->
  <ellipse cx="200" cy="205" rx="62" ry="70" fill="#3A2A1C"/>
  <path d="M120 460 Q120 300 200 300 Q280 300 280 460 Z" fill="#241811"/>
  <path d="M150 320 Q200 345 250 320 L260 380 Q200 400 140 380 Z" fill="#C97D3F"/>

  <!-- straw hat -->
  <ellipse cx="200" cy="150" rx="98" ry="24" fill="#E9CBA0"/>
  <ellipse cx="200" cy="142" rx="58" ry="34" fill="#D9B27C"/>

  <!-- basket of cherries -->
  <path d="M255 400 Q290 395 295 425 Q298 448 265 452 L245 452 Q235 425 255 400 Z" fill="#8C6239"/>
  <g fill="#A5342B">
    <circle cx="262" cy="410" r="6"/>
    <circle cx="272" cy="405" r="6"/>
    <circle cx="280" cy="414" r="6"/>
    <circle cx="268" cy="420" r="6"/>
  </g>
</svg>
